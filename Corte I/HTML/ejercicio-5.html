<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Tablas</title>
</head>

<body>

    <h1>Horario académico</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Día</th>
                <th>Materia</th>
                <th>Horario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Lunes</td>
                <td>Bases de Datos</td>
                <td>7:00 am - 9:00 am</td>
            </tr>
            <tr>
                <td>Sistemas Operativos</td>
                <td>9:00 am - 11:00 am</td>
            </tr>
            <tr>
                <td rowspan="2">Miércoles</td>
                <td>Programación en Ambiente Web I</td>
                <td>7:00 am - 9:00 am</td>
            </tr>
            <tr>
                <td>Licenciamiento de Software</td>
                <td>9:00 am - 11:00 am</td>
            </tr>
            <tr>
                <td>Viernes</td>
                <td>Ingeniería de Software</td>
                <td>7:00 am - 10:00 am</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total de materias</td>
                <td>5</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
