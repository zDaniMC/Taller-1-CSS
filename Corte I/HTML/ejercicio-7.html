<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Formularios avanzados</title>
</head>

<body>

    <h1>Formulario de inscripción universitaria</h1>

    <form action="#" method="post">

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" name="edad" min="15" max="99"><br><br>

        <label for="nacimiento">Fecha de nacimiento:</label><br>
        <input type="date" id="nacimiento" name="nacimiento"><br><br>

        <label for="carrera">Carrera:</label><br>
        <select id="carrera" name="carrera">
            <option value="sistemas">Ingeniería de Sistemas</option>
            <option value="industrial">Ingeniería Industrial</option>
            <option value="agronomia">Ingeniería Agronómica</option>
            <option value="contaduria">Contaduría Pública</option>
        </select><br><br>

        <span>Género:</span><br>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label><br>
        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Otro</label><br><br>

        <span>Habilidades:</span><br>
        <input type="checkbox" id="programacion" name="habilidades" value="programacion">
        <label for="programacion">Programación</label><br>
        <input type="checkbox" id="diseno" name="habilidades" value="diseno">
        <label for="diseno">Diseño</label><br>
        <input type="checkbox" id="idiomas" name="habilidades" value="idiomas">
        <label for="idiomas">Idiomas</label><br><br>

        <label for="foto">Foto:</label><br>
        <input type="file" id="foto" name="foto" accept="image/*"><br><br>

        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Enviar inscripción</button>

    </form>

</body>

</html>
