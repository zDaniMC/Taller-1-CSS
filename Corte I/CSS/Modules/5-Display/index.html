<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <span class="span-1">Texto 1</span>
    <span class="span-2">Texto 2</span>
    <span class="span-3">Texto 3 (oculto)</span>

    <div class="div-1">Caja 1</div>
    <div class="div-2">Caja 2</div>
    <div class="div-3">Caja 3 (oculta)</div>

    <!--
        block: ocupa toda la línea.
        inline: solo el espacio del contenido.
        inline-block: como inline pero respeta ancho/alto.
        none: el elemento no se muestra.
    -->
</body>
</html>
